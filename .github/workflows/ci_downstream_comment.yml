name: Downstream comment

# Posts the report from the downstream workflow as a comment on the pull
# request, updating the same comment on later runs. This runs separately, from
# the default branch, because a pull request from a fork cannot be given
# permission to comment.
# workflow_run is safe here because this workflow never checks out or runs
# code from the pull request; it only posts the Markdown report as a comment.
on:
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows: [Downstream]
    types: [completed]

permissions: {}

jobs:
  comment:
    # Without the label every job in the downstream run is skipped.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      actions: read          # to download the report artifact
      pull-requests: write   # to comment
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: compare-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD: ${{ github.event.workflow_run.head_repository.owner.login }}:${{ github.event.workflow_run.head_branch }}
        run: |
          # workflow_run does not list pull requests from forks, so find the
          # open PR for the branch that was tested.
          pr=$(gh api "repos/$REPO/pulls?state=open&head=$HEAD" --jq '.[0].number')
          if [ -z "$pr" ]; then echo "no open pull request for $HEAD"; exit 0; fi
          marker='<!-- downstream-compare -->'
          { echo "$marker"; cat compare-report.md; } > body.md
          id=$(gh api "repos/$REPO/issues/$pr/comments" --paginate \
                 --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md
          else
            gh pr comment "$pr" --repo "$REPO" --body-file body.md
          fi
