name: Daily cron

on:
  workflow_dispatch:
  schedule:
    # run every day at 3am UTC
    - cron: '0 3 * * *'
  # TMP: pull_request/push triggers disabled while debugging the WCSLIB 8.8 wcs crash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH_ON_CI: "normal"
  IS_CRON: "true"
  PY_COLORS: "1"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    if: |
      github.repository == 'astropy/astropy' && (
        github.event_name == 'schedule' ||
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.pull_request.labels.*.name, 'Extra CI')
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Bundling with pyinstaller
            os: ubuntu-latest
            python: '3.11'
            toxenv: pyinstaller

          - name: Python 3.12 with all optional dependencies and pre-releases
            os: ubuntu-latest
            python: '3.12'
            toxenv: py312-test-alldeps-predeps
            toxargs: -v
            toxposargs: --remote-data=any

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        python-version: ${{ matrix.python }}

    - name: Install language-pack-de and tzdata
      if: ${{ matrix.os == 'ubuntu-latest' }}
      run: |
        sudo apt-get update
        sudo apt-get install language-pack-de tzdata

    - name: Install Python dependencies
      run: python -m pip install --upgrade tox

    - name: Run tests
      run: tox ${{ matrix.toxargs}} -e ${{ matrix.toxenv}} -- ${{ matrix.toxposargs}}
